<link rel="stylesheet" href="./styles.css" />

<body>
  <main class="app">
    <header class="hero">
      <h1>灾前 / 灾后对比滑块</h1>
      <p>上传两张图，通过滑块直观比较现场变化。</p>
    </header>

    <section class="card controls">
      <label for="beforeInput">灾前图 <input id="beforeInput" type="file" accept="image/*" /></label>
      <label for="beforeInput">灾后图 <input id="afterInput" type="file" accept="image/*"  aria-label="a ft er In pu t"/></label>
      <p id="status" aria-live="polite">状态: 等待上传两张图片</p>
    </section>

    <section class="card">
      <div id="compare" class="compare">
        <img id="beforeImg" class="base" alt="before" />
        <div id="afterWrap" class="after-wrap">
          <img id="afterImg" alt="after" />
        </div>
        <input id="slider" type="range" min="0" max="100" value="50"  aria-label="对比滑块"/>
      </div>
    </section>
  </main>
    <script src="./pm-metrics.js" defer></script>
<script src="./app.js" defer></script>
