.gnav,.pedagogy-panel,.explore-section,[class*="dark-toggle"],button[aria-label]{display:none!important}
body{background:#fff!important;color:#000!important;font-size:11pt}

<body>
  <main class="app">
    <header class="hero">
      <h1>灾前 / 灾后对比滑块</h1>
      <p>上传两张图，通过滑块直观比较现场变化。</p>
    </header>

    <section class="card">
      <details class="teach-card" open>
        <summary>🎓 “前后对比”在新闻中的应用</summary>
        <p>前后对比滑块是灾难报道、城市变迁、修图检测中的常见可视化手段。升效检查要点：① 两张图片拍摄角度应一致；② 注意光线差异导致的视觉误导；③ 别忘记标注拍摄日期。</p>
      </details>
    </section>

    <section class="card controls">
      <label for="beforeInput">灾前图 <input id="beforeInput" type="file" accept="image/*" /></label>
      <label for="afterInput">灾后图 <input id="afterInput" type="file" accept="image/*" /></label>
      <div style="margin:8px 0">
        <button type="button" id="demoBtn" class="example-btn">📷 加载示例图片（即时体验）</button>
      </div>
      <p id="status" aria-live="polite">状态: 等待上传两张图片</p>
    </section>

    <section class="card">
      <div id="compare" class="compare">
        <img id="beforeImg" class="base" alt="before" />
        <div id="afterWrap" class="after-wrap">
          <img id="afterImg" alt="after" />
        </div>
        <input id="slider" type="range" min="0" max="100" value="50"  aria-label="对比滑块"/>
      </div>
    </section>
  </main>
    <script src="./pm-metrics.js" defer></script>
<script src="./app.js" defer></script>
