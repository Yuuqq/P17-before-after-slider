<!doctype html>
<html lang="zh-CN" class="type-scale-v22">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#F0E6CF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#241B11" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <title>P17 灾前/灾后对比滑块</title>
  <link rel="stylesheet" href="../shared/design-tokens.css" />
  <link rel="stylesheet" href="../shared/modern-styles.css" />
  <link rel="stylesheet" href="../shared/tool-chrome.css" />
  <link rel="stylesheet" href="./styles.css" />
  <meta name="description" content="上传灾前与灾后两张图，拖动滑块对照现场变化。计算在本机完成。" />
  <meta property="og:title" content="P17 灾前/灾后对比滑块" />
  <meta property="og:description" content="灾前与灾后对照滑块。示例图仅供课堂，输出不得单独当作结论。" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://yuuqq.github.io/P17-before-after-slider/" />
  <link rel="manifest" href="./manifest.json" />
</head>
<body>
  <a href="#main" class="skip-link">跳到主内容</a>
  <main id="main" class="app">
    <header class="tool-chrome" data-tool-id="P17">
      <a class="tool-chrome__mark" href="../P00-dashboard/">新闻实验工具</a>
      <span class="tool-chrome__id">P17</span>
    </header>

    <header class="hero">
      <h1>灾前 / 灾后对比滑块</h1>
      <p>上传两张图，通过滑块比较现场变化。</p>
    </header>

    <details class="tool-teach">
      <summary>如何使用</summary>
      <p>上传角度一致的灾前、灾后两张图，或载入示例图，再拖动底部滑块。左侧是灾后，右侧是灾前。光线不同会误导判断，记得标明拍摄日期。</p>
    </details>

    <section class="card controls">
      <label for="beforeInput">灾前图
        <input id="beforeInput" type="file" accept="image/*" />
      </label>
      <label for="afterInput">灾后图
        <input id="afterInput" type="file" accept="image/*" />
      </label>
      <div class="control-actions">
        <button type="button" id="demoBtn" class="example-btn">加载示例图片</button>
        <p id="status" role="status">状态: 等待上传两张图片</p>
      </div>
    </section>

    <section class="stage" aria-label="灾前与灾后对比">
      <div id="compare" class="compare">
        <img id="beforeImg" class="base" alt="灾前" loading="lazy" decoding="async" />
        <div id="afterWrap" class="after-wrap">
          <img id="afterImg" alt="灾后" loading="lazy" decoding="async" />
        </div>
        <input id="slider" type="range" min="0" max="100" value="50" aria-label="对比滑块" />
      </div>
    </section>

    <footer class="tool-footer">
      数据边界以附录 A 为准：能在本机完成的计算不主动外发；示例数据仅供课堂；本工具输出不得单独当作结论。
      <a href="../P00-dashboard/">返回工具箱</a>
    </footer>
  </main>
  <script src="./pm-metrics.js" defer></script>
  <script src="./app.js" defer></script>
  <script src="../shared/releases/v2.6/loader.js" data-modules="dark,cmd,toast,onboarding,pedagogy-p1,pedagogy-p2,nav,kbd"></script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}</script>
</body>
</html>
